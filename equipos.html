<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encabezado FEUPS</title>
    <style>
        /* Reset de estilos básicos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050a18; /* Color oscuro del fondo de la imagen */
        }

        /* Estilos del Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background-color: #050a18;
            color: white;
        }

        /* Contenedor del Logo */
        .logo img {
            height: 50px; /* Ajusta según el tamaño de tu imagen real */
            display: block;
        }

        /* Navegación Central */
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.3s;
        }

        /* Estilo para el botón activo/seleccionado */
        nav ul li a.active {
            background-color: #1e2a44; /* Fondo sutil para resaltar */
            padding: 8px 16px;
            border-radius: 5px;
            color: #f1c40f; /* Color amarillento similar al de la captura */
        }

        nav ul li a:hover {
            color: #f1c40f;
        }

        /* Icono de Login (Derecha) */
        .login-icon {
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        /* Responsividad básica */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            nav {
                display: none; /* Ocultar en móviles o implementar menú hamburguesa */
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="https://via.placeholder.com/150x50/050a18/FFFFFF?text=FEUPS" alt="Logo FEUPS">
        </div>

        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Torneo</a></li>
                <li><a href="#" class="active">Equipos</a></li>
            </ul>
        </nav>

        <div class="login-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </div>
    </header>

</body>
</html>
