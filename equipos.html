<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo VDQ - Equipos</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #050a18;
            color: white;
            line-height: 1.6;
        }

        /* --- ENCABEZADO --- */
        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background-color: #050a18;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img { height: 50px; display: block; }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
            margin-right: 100px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 20px;
            transition: 0.3s;
        }

        nav ul li a.active {
            background-color: #1a253d;
            color: #f1c40f;
            border-radius: 6px;
        }

        nav ul li a:hover:not(.active) { color: #f1c40f; }

        /* --- TÍTULO Y CONTENEDOR --- */
        .main-title {
            text-align: center;
            font-size: 32px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- MATRIZ DE EQUIPOS (3x3) --- */
        .grid-equipos {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #0d1b3e;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #1a253d;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card:hover { transform: translateY(-5px); border-color: #2563eb; }

        .card-header {
            background-color: #2563eb;
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .card-body {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .team-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            background: white;
            border-radius: 5px;
            padding: 3px;
        }

        .team-info p { font-size: 14px; color: #ccc; }
        .team-info span { font-weight: bold; color: white; }

        /* --- VENTANA EMERGENTE (MODAL) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 25px;
            width: 90%;
            max-width: 550px;
            border-radius: 12px;
            color: #333;
            position: relative;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close {
            position: absolute; right: 20px; top: 10px;
            font-size: 30px; cursor: pointer; color: #666;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2563eb; color: white; padding: 12px; text-align: left; font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: middle; }
        .img-jugador { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 1px solid #ddd; }

        /* Responsividad */
        @media (max-width: 992px) { .grid-equipos { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { 
            .grid-equipos { grid-template-columns: 1fr; }
            header { padding: 20px; flex-direction: column; gap: 15px; }
            nav { margin-right: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="LP">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneo.html">Torneo</a></li>
                <li><a href="equipos.html" class="active">Equipos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="main-title">EQUIPOS</h1>

        <div class="grid-equipos">
            <div class="card" onclick="abrirModal('Equipo 1')">
                <div class="card-header">Equipo 1 <span>👥</span></div>
                <div class="card-body">
                    <img src="img/equipos/equipo.png" alt="Logo" class="team-logo">
                    <div class="team-info">
                        <p>Abreviatura: <span>EQ1</span></p>
                        <p>Dirigente: <span>-</span></p>
                    </div>
                </div>
            </div>

            <div class="card" onclick="abrirModal('Equipo 2')">
                <div class="card-header">Equipo 2 <span>👥</span></div>
                <div class="card-body">
                    <img src="img/equipos/equipo.png" alt="Logo" class="team-logo">
                    <div class="team-info">
                        <p>Abreviatura: <span>EQ2</span></p>
                        <p>Dirigente: <span>-</span></p>
                    </div>
                </div>
            </div>

            <div class="card" onclick="abrirModal('Equipo 3')">
                <div class="card-header">Equipo 3 <span>👥</span></div>
                <div class="card-body">
                    <img src="img/equipos/equipo.png" alt="Logo" class="team-logo">
                    <div class="team-info">
                        <p>Abreviatura: <span>EQ3</span></p>
                        <p>Dirigente: <span>-</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="miModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 id="modal-titulo" style="border-bottom: 2px solid #2563eb; padding-bottom: 10px;">Jugadores</h2>
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>N°</th>
                    </tr>
                </thead>
                <tbody id="lista-jugadores"></tbody>
            </table>
        </div>
    </div>

    <script>
        // BASE DE DATOS VACÍA
        const datosEquipos = {
            'Equipo 1': [],
            'Equipo 2': [],
            'Equipo 3': []
        };

        function abrirModal(nombreKey) {
            const modal = document.getElementById("miModal");
            const lista = document.getElementById("lista-jugadores");
            const titulo = document.getElementById("modal-titulo");

            titulo.innerText = "Lista de Jugadores";
            modal.style.display = "block";
            
            lista.innerHTML = ""; 

            const jugadores = datosEquipos[nombreKey];

            // Si el arreglo está vacío o no existe, muestra el mensaje
            if (!jugadores || jugadores.length === 0) {
                lista.innerHTML = "<tr><td colspan='4' style='text-align:center; padding: 20px; color: #666; font-style: italic;'>No se han registrado jugadores</td></tr>";
            } else {
                jugadores.forEach(j => {
                    lista.innerHTML += `
                        <tr>
                            <td><img src="${j.foto}" class="img-jugador"></td>
                            <td>${j.nombre}</td>
                            <td>${j.edad}</td>
                            <td>${j.numero}</td>
                        </tr>
                    `;
                });
            }
        }

        function cerrarModal() {
            document.getElementById("miModal").style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById("miModal")) {
                cerrarModal();
            }
        }
    </script>
</body>
</html>
