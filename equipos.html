<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo VDQ</title>
    <style>
        /* --- 1. PEGA AQUÍ TODO EL CSS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #050a18;
            color: white;
        }

        /* Encabezado */
        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background-color: #050a18;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img { height: 50px; display: block; }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
            margin-right: 100px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            padding: 8px 20px;
            transition: 0.3s;
        }

        nav ul li a.active {
            background-color: #1a253d;
            color: #f1c40f;
            border-radius: 6px;
        }

        /* Grid de Equipos */
        .grid-equipos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: #0d1b3e;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #1a253d;
            overflow: hidden;
        }

        .card-header {
            background-color: #2563eb;
            padding: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .card-body {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Tamaño corregido del logo del equipo */
        .team-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            background: white;
            border-radius: 4px;
        }

        /* Ventana Emergente (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            color: #333;
            position: relative;
        }

        .close {
            position: absolute; right: 20px; top: 10px;
            font-size: 30px; cursor: pointer;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2563eb; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #ddd; }
        .img-jugador { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="LP">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneo.html">Torneo</a></li>
                <li><a href="equipos.html" class="active">Equipos</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 style="text-align: center; margin: 20px 0; font-size: 32px;">EQUIPOS</h1>

        <div class="grid-equipos">
            <div class="card" onclick="abrirModal('Los Sobrinos')">
                <div class="card-header">Los Sobrinos de Sesar Quinteros <span>👥</span></div>
                <div class="card-body">
                    <img src="img/equipos/equipo1.png" alt="Logo" class="team-logo">
                    <div class="team-info">
                        <p>Abreviatura: <span>SSQ</span></p>
                        <p>Dirigente: <span>Patricio Haro</span></p>
                    </div>
                </div>
            </div>
            </div>
    </main>

    <div id="miModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 id="modal-titulo">Jugadores del Equipo</h2>
            <table>
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>N°</th>
                    </tr>
                </thead>
                <tbody id="lista-jugadores">
                    </tbody>
            </table>
        </div>
    </div>

    
    <script>
        /* --- 2. AQUÍ TODO EL JAVASCRIPT JUGADORES--- */
        function abrirModal(nombreEquipo) {
            document.getElementById("miModal").style.display = "block";
            document.getElementById("modal-titulo").innerText = "Jugadores: " + nombreEquipo;
            
            const lista = document.getElementById("lista-jugadores");
            // Aquí puedes personalizar los jugadores por equipo más adelante
            lista.innerHTML = `
                <tr>
                    <td><img src="img/jugadores/denis.jpg" class="img-jugador"></td>
                    <td>Marlon Yajamin</td>
                    <td>22</td>
                    <td>25</td>
                </tr>
            /*----AÑADIR JUGADOR------*/
            <tr>
                    <td><img src="img/jugadores/denis.jpg" class="img-jugador"></td>
                    <td>Denis Aguaisa</td>
                    <td>23</td>
                    <td>12</td>
                </tr>
            /*-----FIN AÑADIR JUGADOR------*/
            `;
            
        }

        function cerrarModal() {
            document.getElementById("miModal").style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById("miModal")) {
                cerrarModal();
            }
        }
    </script>
</body>
</html>
