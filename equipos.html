<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipos - Torneo VDQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <img src="logo.png" alt="Logo Torneo" class="logo-nav">
            <nav>
                <a href="index.html">Inicio</a>
                <a href="torneo.html">Torneo</a>
                <a href="equipos.html">Equipos</a>
                <a href="admin.html" class="admin-link">Login Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 style="text-align: center; margin-top: 20px;">Equipos Participantes</h1>
        
        <div id="lista-equipos" class="equipos-grid">
            </div>
    </main>

    <div id="modalJugadores" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <div class="modal-header">
                <img id="modal-logo-equipo" src="" alt="Logo Equipo" style="width: 80px;">
                <h2 id="modal-titulo-equipo">Nombre del Equipo</h2>
            </div>
            <hr>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Foto</th>
                        <th>Nombre</th>
                        <th>Edad</th>
                    </tr>
                </thead>
                <tbody id="tabla-jugadores-cuerpo">
                    </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
