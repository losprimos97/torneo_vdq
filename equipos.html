<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo VDQ - Equipos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="LP">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneo.html">Torneo</a></li>
                <li><a href="equipos.html" class="active">Equipos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        
        <section id="equipos-header">
            <h1 class="main-title">EQUIPOS</h1>
        </section>

        <div class="grid-equipos">
            
            <div class="card" onclick="abrirModal('Los Sobrinos de Sesar Quinteros')">
                <div class="card-header">
                    Los Sobrinos de Sesar Quinteros 
                    <span class="icon">👥</span>
                </div>
                <div class="card-body">
                    <img src="logo.png" alt="Logo Equipo" class="team-logo">
                    <div class="team-info">
                        <p>Abreviatura: <span>SSQ</span></p>
                        <p>Dirigente: <span>Patricio Haro</span></p>
                    </div>
                </div>
            </div>

            </div>

        <div id="miModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="cerrarModal()">&times;</span>
                <h2 id="modal-titulo">Jugadores del Equipo</h2>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Nombre</th>
                                <th>Edad</th>
                                <th>Número</th>
                            </tr>
                        </thead>
                        <tbody id="lista-jugadores">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
