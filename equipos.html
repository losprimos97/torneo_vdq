<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Equipos</title>
<link rel="stylesheet" href="style.css">

<style>

body{
background:#071f3a;
color:white;
font-family:Arial;
}

.titulo{
text-align:center;
margin-top:40px;
font-size:40px;
}

.contenedor-equipos{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
margin-top:40px;
}

.equipo-card{
background:#1d3c6a;
border-radius:12px;
width:260px;
padding:15px;
cursor:pointer;
transition:0.3s;
}

.equipo-card:hover{
transform:scale(1.05);
background:#2b5aa0;
}

.equipo-header{
font-weight:bold;
margin-bottom:10px;
}

.equipo-info{
display:flex;
align-items:center;
gap:10px;
}

.equipo-info img{
width:50px;
height:50px;
border-radius:8px;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
}

.modal-content{
background:white;
color:black;
width:500px;
max-height:80%;
overflow:auto;
margin:80px auto;
padding:20px;
border-radius:10px;
}

.cerrar{
float:right;
font-size:20px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#2b5aa0;
color:white;
padding:8px;
}

td{
border:1px solid #ccc;
padding:8px;
text-align:center;
}

.jugador-foto{
width:40px;
height:40px;
border-radius:6px;
}

</style>

</head>

<body>

<h1 class="titulo">EQUIPOS</h1>

<div class="contenedor-equipos">

<div class="equipo-card" onclick="abrirEquipo()">

<div class="equipo-header">
Los Sobrinos de Cesar Quinteros
</div>

<div class="equipo-info">
<img src="img/equipos/equipo1.png">
<div>
Abreviatura: SSQ<br>
Dirigente: Patricio Haro
</div>
</div>

</div>

</div>

<div id="modalEquipo" class="modal">

<div class="modal-content">

<span class="cerrar" onclick="cerrarEquipo()">X</span>

<h2>Jugadores del Equipo</h2>

<table>

<tr>
<th>Foto</th>
<th>Nombre</th>
<th>Edad</th>
<th>Número</th>
</tr>

<tr>
<td><img class="jugador-foto" src="img/jugadores/j1.jpg"></td>
<td>Marlon Yajamin</td>
<td>22</td>
<td>25</td>
</tr>

<tr>
<td><img class="jugador-foto" src="img/jugadores/j2.jpg"></td>
<td>Jonathan Lucumi</td>
<td>28</td>
<td>9</td>
</tr>

<tr>
<td><img class="jugador-foto" src="img/jugadores/j3.jpg"></td>
<td>Nixon Cali</td>
<td>24</td>
<td>7</td>
</tr>

</table>

</div>

</div>

<script>

function abrirEquipo(){
document.getElementById("modalEquipo").style.display="block";
}

function cerrarEquipo(){
document.getElementById("modalEquipo").style.display="none";
}

</script>

</body>
</html>
