<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo VDQ</title>
    <style>
        /* Reset y configuración base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050a18; /* Azul muy oscuro de fondo */
            color: white;
            line-height: 1.6;
        }

        /* --- ESTILOS DEL ENCABEZADO --- */
        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background-color: #050a18;
            position: sticky; 
            top: 0;
            z-index: 1000;
        }

        .logo {
            flex: 0 1 auto;
        }

        .logo img {
            height: 50px; /* Ajusta según el tamaño de tu logo.png */
            display: block;
        }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
            margin-right: 100px; /* Equilibra visualmente el espacio del logo */
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 20px;
            transition: 0.3s;
        }

        /* Clase para el botón resaltado (Equipos) */
        nav ul li a.active {
            background-color: #1a253d;
            color: #f1c40f; 
            border-radius: 6px;
        }

        nav ul li a:hover:not(.active) {
            color: #f1c40f;
        }

        /* --- CONTENIDO PRINCIPAL --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Estilo para el título EQUIPOS */
        .main-title {
            text-align: center;
            font-size: 32px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="LP">
        </div>

        <nav>
            <ul>
                <li><a href="index.html" class="active">Inicio</a></li>
                <li><a href="torneo.html">Torneo</a></li>
                <li><a href="equipos.html">Equipos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        
        <section id="inicio">
            <h1 class="main-title">INICIO</h1>
            
            <p style="text-align: center; color: #666;">(Aquí aparecerán las tarjetas de los equipos)</p>
        </section>

    </main>

</body>
</html>
