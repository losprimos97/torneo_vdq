<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo VDQ - Torneo</title>
    <style>
        /* Reset y configuración base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050a18;
            color: white;
            line-height: 1.6;
        }

        /* --- ENCABEZADO --- */
        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background-color: #050a18;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img { height: 50px; display: block; }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
            margin-right: 100px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 20px;
            transition: 0.3s;
        }

        nav ul li a.active {
            background-color: #1a253d;
            color: #f1c40f; 
            border-radius: 6px;
        }

        /* --- ESTILOS DEL ACORDEÓN --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-title {
            text-align: center;
            font-size: 32px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Botón de la lista desplegable */
        .accordion {
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            padding: 15px 20px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.4s;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .accordion:hover, .active-acc {
            background-color: #1d4ed8;
        }

        /* Panel que se despliega */
        .panel {
            padding: 0 15px;
            background-color: #0d1b3e;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border-radius: 0 0 8px 8px;
            margin-bottom: 15px;
        }

        /* --- ESTILOS DE TABLA --- */
        .table-container {
            overflow-x: auto;
            padding: 15px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background-color: #1e3a8a;
            color: #60a5fa;
            padding: 12px;
            text-align: center;
            border: 1px solid #1a253d;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #1a253d;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        .team-logo-mini {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        /* Responsividad para móviles */
        @media (max-width: 992px) {
            header { padding: 20px; flex-direction: column; gap: 15px; }
            nav { margin-right: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="img/logo.png" alt="LP">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneo.html" class="active">Torneo</a></li>
                <li><a href="equipos.html">Equipos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="main-title">TORNEO</h1>

        <button class="accordion">🏆 Posiciones</button>
        <div class="panel">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Equipo</th>
                            <th>PJ</th>
                            <th>PG</th>
                            <th>PE</th>
                            <th>PP</th>
                            <th>GF</th>
                            <th>GC</th>
                            <th>Puntos</th>
                            <th>GD</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>
                                <div class="team-info">
                                    <img src="img/equipos/equipo1.png" class="team-logo-mini">
                                    Los Sobrinos de Sesar Quinteros
                                </div>
                            </td>
                            <td>5</td><td>4</td><td>1</td><td>0</td><td>14</td><td>5</td><td>13</td><td>9</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>
                                <div class="team-info">
                                    <img src="img/equipos/equipo2.png" class="team-logo-mini">
                                    Corinthians Engineering FC
                                </div>
                            </td>
                            <td>5</td><td>3</td><td>1</td><td>1</td><td>27</td><td>12</td><td>10</td><td>15</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="accordion">⚽ Goleadores</button>
        <div class="panel">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Equipo</th>
                            <th>Goles</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Marlon Yajamin</td>
                            <td>Los Sobrinos</td>
                            <td>8</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <button class="accordion">🫱 Sancionados</button>
        <div class="panel">
            <p style="padding: 20px; text-align: center; color: #aaa;">No hay sanciones registradas en esta fecha.</p>
        </div>

    </main>

    <script>
        // Lógica para abrir y cerrar las listas (acordeón)
        const acc = document.getElementsByClassName("accordion");
        
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                /* Alternar clase para cambiar color del botón al estar activo */
                this.classList.toggle("active-acc");

                /* Mostrar/ocultar el panel */
                const panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                } 
            });
        }
    </script>

</body>
</html>
