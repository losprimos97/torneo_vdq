<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #050a18;
        }

        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background-color: #050a18;
            color: white;
            /* Esto asegura que el contenido ocupe todo el ancho */
            justify-content: space-between; 
        }

        /* Contenedor del Logo (Izquierda) */
        .logo {
            flex: 0 1 auto; /* No crece, se ajusta a su contenido */
        }

        .logo img {
            height: 45px;
            display: block;
        }

        /* Navegación (Centrada) */
        nav {
            flex: 1; /* Toma el espacio restante para permitir el centrado */
            display: flex;
            justify-content: center; /* Centra el contenido de la nav */
            margin-right: 100px; /* Compensación visual para que el centro sea real respecto a la pantalla, no al espacio sobrante */
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        /* Estilo del botón activo (Equipos) */
        nav ul li a.active {
            background-color: #1a253d;
            padding: 8px 20px;
            border-radius: 6px;
            color: #f1c40f; /* El amarillo de la imagen */
        }

        nav ul li a:hover:not(.active) {
            color: #f1c40f;
        }

        /* Responsivo */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
                padding: 20px;
            }
            nav {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>

        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#" class="active">Torneo</a></li>
                <li><a href="#">Equipos</a></li>
            </ul>
        </nav>
        <section id="inicio" style="height: 100vh;">
    </section>

<section id="torneo" style="height: 100vh;">
    </section>

<section id="equipos">
    <h1 style="color: white; text-align: center; margin-top: 50px; font-size: 3rem; letter-spacing: 2px;">EQUIPOS</h1>
    </section>
    </header>

</body>
</html>
