<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneo VDQ - Torneo</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #050a18;
            color: white;
            line-height: 1.6;
        }

        /* --- ENCABEZADO --- */
        header {
            display: flex;
            align-items: center;
            padding: 20px 50px;
            background-color: #050a18;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo img { height: 50px; display: block; }

        nav {
            flex: 1;
            display: flex;
            justify-content: center;
            margin-right: 100px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            padding: 8px 20px;
            transition: 0.3s;
        }

        nav ul li a.active {
            background-color: #1a253d;
            color: #f1c40f; 
            border-radius: 6px;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .main-title {
            text-align: center;
            font-size: 32px;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- ESTILOS DEL ACORDEÓN --- */
        .accordion {
            background-color: #2563eb;
            color: white;
            cursor: pointer;
            padding: 15px 20px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .accordion:hover, .active-acc { background-color: #1d4ed8; }

        .panel {
            padding: 0 15px;
            background-color: #0d1b3e;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border-radius: 0 0 8px 8px;
            margin-bottom: 15px;
        }

        /* Mensaje de vacío */
        .empty-message {
            padding: 20px;
            text-align: center;
            color: #94a3b8;
            font-style: italic;
        }

        /* --- RESPONSIVIDAD --- */
        @media (max-width: 768px) {
            header { flex-direction: column; padding: 20px; gap: 15px; }
            nav { margin-right: 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><img src="img/logo.png" alt="LP"></div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="torneo.html" class="active">Torneo</a></li>
                <li><a href="equipos.html">Equipos</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="main-title">TORNEO</h1>

        <button class="accordion">🏆 Posiciones</button>
        <div class="panel">
            <p class="empty-message">Aún no se han registrado equipos</p>
        </div>

        <button class="accordion">⚽ Goleadores</button>
        <div class="panel">
            <p class="empty-message">No hay registros</p>
        </div>

        <button class="accordion">🫱 Sancionados</button>
        <div class="panel">
            <p class="empty-message">No hay registros</p>
        </div>

    </main>

    <script>
        // Lógica para abrir/cerrar el acordeón
        const acc = document.getElementsByClassName("accordion");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active-acc");
                const panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                } 
            });
        }
    </script>
</body>
</html>
